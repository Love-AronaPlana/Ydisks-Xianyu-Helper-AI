name: 同步 GitHub Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki-main
  cancel-in-progress: true

jobs:
  sync:
    name: 同步仓库 Wiki 页面
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支文档
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 克隆 GitHub Wiki 仓库
        id: wiki
        env:
          # 固定使用当前仓库自身的 Wiki，仓库被镜像或改名后不会误连原仓库。
          WIKI_REPOSITORY: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          if git clone "$WIKI_REPOSITORY" wiki 2>wiki-clone-error.log; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "not found" wiki-clone-error.log; then
            # GitHub 只在网页端创建第一页后才生成 <仓库>.wiki.git，未初始化时跳过而不是失败。
            echo "::warning::当前仓库的 Wiki 尚未初始化（${{ github.repository }}.wiki.git 不存在），本次跳过同步。请在网页端打开 Wiki 页面创建第一页，之后本工作流会自动同步 docs/wiki。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            sed -e "s#$WIKI_REPOSITORY#<wiki-repository>#g" wiki-clone-error.log >&2
            exit 1
          fi

      - name: 镜像 Wiki 页面
        if: steps.wiki.outputs.ready == 'true'
        run: rsync -a --delete --exclude='.git' docs/wiki/ wiki/

      - name: 提交并推送 Wiki
        if: steps.wiki.outputs.ready == 'true'
        working-directory: wiki
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki 内容没有变化。"
            exit 0
          fi
          git commit -m "docs: 同步项目 Wiki"
          git push origin HEAD:master
